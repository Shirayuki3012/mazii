<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JLPT Flashcards</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">あ</div>
        <div>
          <div class="brand-title">JLPT Learning</div>
          <div class="brand-subtitle">Flashcards</div>
        </div>
      </div>

      <section class="panel-block">
        <div class="section-title">Cấp độ</div>
        <div class="level-list" id="level-list"></div>
      </section>

      <section class="panel-block">
        <div class="section-title">Bộ từ</div>
        <div class="filter-list">
          <label class="filter-row">
            <input type="radio" name="studyFilter" value="all" checked />
            <span>Toàn bộ flashcard</span>
          </label>
          <label class="filter-row">
            <input type="radio" name="studyFilter" value="known" />
            <span>Chỉ từ đã thuộc</span>
          </label>
          <label class="filter-row">
            <input type="radio" name="studyFilter" value="unknown" />
            <span>Chỉ từ chưa thuộc</span>
          </label>
          <label class="filter-row">
            <input type="radio" name="studyFilter" value="unmarked" />
            <span>Chỉ từ chưa đánh dấu</span>
          </label>
        </div>
      </section>

      <section class="panel-block">
        <div class="section-title">Điều hướng</div>
        <div class="nav-links">
          <a class="nav-link active" href="/">Học Flashcard</a>
          <a class="nav-link" href="/quiz">Làm quiz</a>
          <a class="nav-link" href="/data">Quản lý dữ liệu</a>
        </div>
      </section>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <div class="page-kicker">Học tiếng Nhật</div>
          <h1>Flashcard JLPT</h1>
        </div>
        <div class="header-actions">
          <button class="ghost-button" id="shuffle-button">Xáo trộn</button>
          <button class="ghost-button" id="random-mode-button">Ngẫu nhiên: tắt</button>
          <button class="primary-button" id="start-button">Bắt đầu học</button>
        </div>
      </header>

      <section class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Tổng từ</div>
          <div class="stat-number" id="total-count">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Đã thuộc</div>
          <div class="stat-number known-text" id="known-count">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Chưa thuộc</div>
          <div class="stat-number unknown-text" id="unknown-count">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Chưa đánh dấu</div>
          <div class="stat-number" id="unmarked-count">0</div>
        </div>
      </section>

      <section class="flashcard-area">
        <div class="flashcard-wrapper">
          <div class="flashcard-frame">
            <button class="nav-button arrow-button" id="prev-button" aria-label="Quay lại">←</button>

            <div class="flashcard-container">
              <div class="card-topbar">
                <div class="card-topbar-left">
                  <span class="level-badge" id="card-level">N5</span>
                  <span class="word-type-badge hidden" id="word-type-badge"></span>
                </div>
                <span class="card-index" id="card-index">1/1</span>
              </div>

              <button class="flashcard" id="flashcard-button">
                <div class="flashcard-inner">
                  <div class="front-face">
                    <div class="question-label">WORD</div>
                    <div class="word-text" id="word-text">おはようございます</div>
                  </div>
                  <div class="back-face">
                    <div class="question-label">WORD • PHONETIC • MEAN</div>
                    <div class="back-word" id="back-word">おはようございます</div>
                    <div class="back-phonetic" id="back-phonetic">ohayō gozaimasu</div>
                    <div class="back-meaning" id="mean-text">Chào buổi sáng</div>
                    <div class="separator"></div>
                    <div class="back-meta">
                      <span id="back-level">Level N5</span>
                      <span class="word-type-badge hidden" id="back-word-type"></span>
                    </div>
                  </div>
                </div>
              </button>

              <div class="flashcard-actions">
                <button class="icon-button" id="known-button">
                  <span>↑</span> Đã thuộc
                </button>
                <button class="icon-button" id="unknown-button">
                  <span>↓</span> Chưa thuộc
                </button>
                <button class="icon-button" id="flip-button">
                  <span>␣</span> Xem mặt sau
                </button>
                <button class="icon-button lookup-button" id="lookup-button" aria-label="Tra cứu trên Mazii">
                  <span>+</span> Tra cứu 
                </button>
              </div>

              <div class="study-progress">
                <div class="progress-label">
                  <span>Tiến độ</span>
                  <span id="progress-text">0%</span>
                </div>
                <div class="progress-track">
                  <div class="progress-bar" id="progress-bar"></div>
                </div>
              </div>
            </div>

            <button class="nav-button arrow-button" id="next-button" aria-label="Từ tiếp theo">→</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/tour.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      Tour.start([
        {
          target: null,
          position: 'center',
          title: 'Chào mừng đến với JLPT Flashcards!',
          content: `
            <p>Ứng dụng giúp bạn học từ vựng tiếng Nhật theo phương pháp flashcard.</p>
            <p>Hướng dẫn ngắn này sẽ giới thiệu các tính năng chính — chỉ mất khoảng <strong>1 phút</strong>.</p>
          `
        },
        {
          target: '.sidebar',
          position: 'right',
          padding: 0,
          title: 'Thanh điều hướng',
          content: `
            <p>Toàn bộ điều khiển nằm ở đây:</p>
            <ul style="margin:8px 0 0 16px;padding:0;display:flex;flex-direction:column;gap:4px">
              <li><strong>Cấp độ</strong> — chọn N5→N1 để lọc bộ từ</li>
              <li><strong>Bộ từ</strong> — lọc theo trạng thái học</li>
              <li><strong>Điều hướng</strong> — chuyển sang Quiz hoặc Data</li>
            </ul>
          `
        },
        {
          target: '#level-list',
          position: 'right',
          title: 'Chọn cấp độ',
          content: `
            <p>Bấm vào từng nút để <strong>bật/tắt</strong> cấp độ đó.</p>
            <p>Có thể chọn nhiều cấp độ cùng lúc. Số bên phải là tổng từ của cấp đó.</p>
          `
        },
        {
          target: '.filter-list',
          position: 'right',
          title: 'Lọc bộ từ',
          content: `
            <p>Chọn tập flashcard bạn muốn ôn:</p>
            <ul style="margin:8px 0 0 16px;padding:0;display:flex;flex-direction:column;gap:4px">
              <li><strong>Toàn bộ</strong> — học tất cả từ đã chọn</li>
              <li><strong>Chưa thuộc</strong> — tập trung vào từ yếu</li>
              <li><strong>Chưa đánh dấu</strong> — từ chưa học lần nào</li>
            </ul>
          `
        },
        {
          target: '.stats-row',
          position: 'bottom',
          title: 'Thống kê tiến độ',
          content: `
            <p>Theo dõi quá trình học theo thời gian thực.</p>
            <p>Tiến độ được <strong>tự động lưu</strong> sau mỗi lần đánh dấu.</p>
          `
        },
        {
          target: '#flashcard-button',
          position: 'top',
          title: 'Flashcard',
          content: `
            <p><strong>Bấm vào card</strong> hoặc nhấn <kbd>Space</kbd> để lật xem mặt sau.</p>
            <p>Mặt sau hiển thị từ, cách đọc, nghĩa và loại từ.</p>
          `
        },
        {
          target: '.flashcard-actions',
          position: 'top',
          title: 'Đánh dấu mức độ thuộc',
          content: `
            <p>Sau khi xem mặt sau, hãy tự đánh giá:</p>
            <ul style="margin:8px 0 0 16px;padding:0;display:flex;flex-direction:column;gap:4px">
              <li><strong>↑ Đã thuộc</strong> — hoặc nhấn <kbd>↑</kbd></li>
              <li><strong>↓ Chưa thuộc</strong> — hoặc nhấn <kbd>↓</kbd></li>
              <li><strong>Tra cứu</strong> — mở Mazii.net để xem chi tiết</li>
            </ul>
          `
        },
        {
          target: '.flashcard-frame',
          position: 'bottom',
          title: 'Điều hướng card',
          content: `
            <p>Dùng nút <strong>← →</strong> hoặc phím <kbd>←</kbd> <kbd>→</kbd> để chuyển card.</p>
            <p>Bấm <strong>Xáo trộn</strong> ở góc trên phải để đổi thứ tự ngẫu nhiên.</p>
          `
        }
      ], 'flashcard');
    });
  </script>
</body>
</html>
