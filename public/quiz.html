<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Làm quiz JLPT</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">あ</div>
        <div>
          <div class="brand-title">JLPT Learning</div>
          <div class="brand-subtitle">Quiz Kanji</div>
        </div>
      </div>

      <section class="panel-block">
        <div class="section-title">Cấp độ</div>
        <div class="level-list" id="level-list"></div>
      </section>

      <section class="panel-block">
        <div class="section-title">Điều hướng</div>
        <div class="nav-links">
          <a class="nav-link" href="/">Học Flashcard</a>
          <a class="nav-link active" href="/quiz">Làm quiz</a>
          <a class="nav-link" href="/data">Quản lý dữ liệu</a>
        </div>
      </section>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <div class="page-kicker">Học tiếng Nhật</div>
          <h1>Làm quiz</h1>
        </div>
      </header>

      <section class="quiz-start-screen" id="quiz-start-screen">
        <button class="primary-button quiz-start-button" id="start-button" type="button">
          Bắt đầu học
        </button>
        <p class="quiz-start-hint" id="quiz-start-hint">
          Chọn cấp độ ở sidebar, sau đó bấm bắt đầu để làm quiz kanji.
        </p>
      </section>

      <section class="quiz-area hidden" id="quiz-area">
        <div class="quiz-wrapper">
          <div class="quiz-frame">
            <button class="nav-button arrow-button" id="prev-button" type="button" aria-label="Câu trước">←</button>

            <div class="quiz-container">
              <div class="card-topbar">
                <span class="level-badge" id="quiz-level">N5</span>
                <div class="quiz-index-wrap">
                  <span class="card-index" id="quiz-index">1/1</span>
                  <span class="quiz-generation-status hidden" id="quiz-generation-status"></span>
                </div>
              </div>

              <div class="quiz-card" id="quiz-card">
                <div class="question-label" id="quiz-question-label">Điền kanji còn thiếu</div>
                <div class="quiz-word" id="quiz-word"></div>
                <div class="quiz-phonetic" id="quiz-phonetic"></div>
                <div class="quiz-meaning" id="quiz-meaning"></div>

                <div class="quiz-options" id="quiz-options"></div>

                <div class="quiz-feedback hidden" id="quiz-feedback"></div>

                <div class="quiz-waiting hidden" id="quiz-waiting">
                  <div class="quiz-loading-text">Đang tạo câu tiếp theo...</div>
                </div>
              </div>

              <div class="study-progress">
                <div class="progress-label">
                  <span>Tiến độ</span>
                  <span id="progress-text">0%</span>
                </div>
                <div class="progress-track">
                  <div class="progress-bar" id="progress-bar"></div>
                </div>
              </div>
            </div>

            <button class="nav-button arrow-button" id="next-button" type="button" aria-label="Câu tiếp theo">→</button>
          </div>
        </div>
      </section>

      <section class="quiz-loading hidden" id="quiz-loading">
        <div class="quiz-loading-text">Đang tạo câu hỏi đầu tiên...</div>
      </section>
    </main>
  </div>

  <script src="/static/quiz.js"></script>
  <script src="/static/tour.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Helpers để mô phỏng trạng thái "đang quiz" cho tour
      function showQuizAreaForTour() {
        const area = document.getElementById('quiz-area');
        const start = document.getElementById('quiz-start-screen');
        if (area && area.classList.contains('hidden')) {
          area._hiddenByTour = true;
          area.classList.remove('hidden');
          start._hiddenByTour = true;
          start.classList.add('hidden');

          // Đổ nội dung mẫu vào để bước có kích thước thực
          const word = document.getElementById('quiz-word');
          const phonetic = document.getElementById('quiz-phonetic');
          const meaning = document.getElementById('quiz-meaning');
          const options = document.getElementById('quiz-options');
          if (word && !word.textContent) {
            word.textContent = '□語';
            phonetic.textContent = 'げんご';
            meaning.textContent = 'ngôn ngữ';
            options.innerHTML = ['語','言','話','字'].map(k =>
              `<button class="quiz-option-button" disabled>${k}</button>`
            ).join('');
          }
        }
      }

      function hideQuizAreaForTour() {
        const area = document.getElementById('quiz-area');
        const start = document.getElementById('quiz-start-screen');
        if (area && area._hiddenByTour) {
          area.classList.add('hidden');
          area._hiddenByTour = false;
        }
        if (start && start._hiddenByTour) {
          start.classList.remove('hidden');
          start._hiddenByTour = false;
        }
      }

      Tour.start([
        {
          target: null,
          position: 'center',
          title: 'Quiz Kanji',
          content: `
            <p>Kiểm tra khả năng nhận diện kanji bằng bài quiz điền vào chỗ trống.</p>
            <p>Mỗi câu hỏi sẽ ẩn <strong>một kanji</strong> trong từ — bạn chọn đáp án đúng trong 4 lựa chọn.</p>
          `
        },
        {
          target: '#level-list',
          position: 'right',
          title: 'Chọn cấp độ quiz',
          content: `
            <p>Bấm để bật/tắt từng cấp độ N5→N1.</p>
            <p>Quiz chỉ dùng từ có <strong>ít nhất 1 kanji</strong> — từ thuần hiragana sẽ bị bỏ qua.</p>
          `
        },
        {
          target: '#quiz-start-screen',
          position: 'top',
          title: 'Bắt đầu quiz',
          content: `
            <p>Bấm <strong>Bắt đầu học</strong> để tạo bộ câu hỏi.</p>
            <p>Câu hỏi được tạo dần — bạn có thể trả lời ngay khi câu đầu tiên xuất hiện trong khi các câu sau vẫn đang được tạo.</p>
          `
        },
        {
          target: '#quiz-card',
          position: 'bottom',
          before: showQuizAreaForTour,
          title: 'Câu hỏi quiz',
          content: `
            <p>Từ hiển thị với <strong>□</strong> thay cho kanji bị ẩn.</p>
            <p>Phía dưới có phiên âm và nghĩa tiếng Việt để gợi ý.</p>
          `
        },
        {
          target: '#quiz-options',
          position: 'top',
          title: 'Chọn đáp án',
          content: `
            <p>Bấm vào một trong 4 kanji để trả lời.</p>
            <ul style="margin:8px 0 0 16px;padding:0;display:flex;flex-direction:column;gap:4px">
              <li><span style="color:var(--primary);font-weight:700">Xanh</span> — đúng</li>
              <li><span style="color:var(--danger);font-weight:700">Đỏ</span> — sai, đồng thời hiện đáp án đúng</li>
            </ul>
            <p style="margin-top:8px">Tự động chuyển câu tiếp theo sau <strong>3 giây</strong>.</p>
          `
        }
      ], 'quiz', { onFinish: hideQuizAreaForTour });

      // Khi tour kết thúc (finish được gọi), dọn dẹp trạng thái mô phỏng
      const _origFinish = Tour.finish;
      document.addEventListener('tourfinish', hideQuizAreaForTour);

      // Patch Tour.finish để emit event
      const origFinish = Tour.finish;
      Tour.finish = function() {
        hideQuizAreaForTour();
        origFinish();
      };
    });
  </script>
</body>
</html>
